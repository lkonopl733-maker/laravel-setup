<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .form-block { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 5px; max-width: 500px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"], textarea, input[type="submit"] { margin-bottom: 12px; display: block; }
        textarea { width: 100%; height: 80px; }
        a { text-decoration: none; color: #0066cc; }
    </style>
</head>
<body>

    <h1> Файли та файлова структура</h1>

    <!--Завантаження файлу -->
    <div class="form-block">
        <h2>Завантаження зображення</h2>
        <form action="process.php" method="POST" enctype="multipart/form-data">
            <label for="file">Оберіть файл (png, jpg, jpeg до 2 МБ):</label>
            <input type="file" name="upload_file" id="file" required>
            <input type="submit" value="Завантажити файл">
        </form>
    </div>

    <!--Введення тексту для log.txt -->
    <div class="form-block">
        <h2>Запис у лог-файл</h2>
        <form action="text.php" method="POST">
            <label for="user_text">Введіть текст для запису у файл:</label>
            <textarea name="user_text" id="user_text" required></textarea>
            <input type="submit" value="Зберегти текст">
        </form>
        <p><a href="text.php">Переглянути вміст log.txt</a></p>
    </div>

    <!-- Посилання на список файлів -->
    <div class="form-block">
        <h2>Управління файлами</h2>
        <p><a href="list.php">Переглянути список завантажених файлів</a></p>
    </div>

</body>
</html>
